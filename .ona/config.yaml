tasks:
  install-dependencies:
    name: Install dependencies
    description: Install PHP and JavaScript dependencies and initialize the local database
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild
    prebuildRequiresSuccess: true
    command: |
      composer install --no-interaction
      test -f .env || cp .env.example .env
      test -f database/database.sqlite || touch database/database.sqlite
      php artisan key:generate --force
      php artisan migrate --force
      npm install --ignore-scripts

  build:
    name: Build assets
    description: Build the Vite production assets
    triggeredBy:
      - manual
    dependsOn:
      - install-dependencies
    command: npm run build

  test:
    name: Run tests
    description: Run the Laravel test suite
    triggeredBy:
      - manual
    dependsOn:
      - install-dependencies
    command: composer test

services:
  laravel:
    name: Laravel application
    description: Laravel development server
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 8000 --admission creator_only --name "Laravel application"
        php artisan serve --host=0.0.0.0 --port=8000
      ready: curl -fsS http://localhost:8000 >/dev/null

  vite:
    name: Vite asset server
    description: Vite development server for frontend assets
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 5173 --admission creator_only --name "Vite asset server"
        export ONA_EXPOSED_HOST="$(ona environment port get 5173 -f URL | cut -c 9-)"
        __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS="$ONA_EXPOSED_HOST" npm run dev -- --host 0.0.0.0
      ready: curl -fsS http://localhost:5173/@vite/client >/dev/null

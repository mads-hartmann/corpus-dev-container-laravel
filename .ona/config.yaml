tasks:
  install-dependencies:
    name: Install dependencies
    description: Install PHP and JavaScript dependencies and initialize the local SQLite database
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild
    prebuildRequiresSuccess: true
    command: |
      composer install --no-interaction --prefer-dist
      npm install --ignore-scripts
      test -f .env || cp .env.example .env
      php artisan key:generate --force
      touch database/database.sqlite
      php artisan migrate --force

  build:
    name: Build frontend assets
    description: Build the production Vite asset bundle
    triggeredBy:
      - manual
    dependsOn:
      - install-dependencies
    command: npm run build

  test:
    name: Run tests
    description: Run the Laravel test suite
    triggeredBy:
      - manual
    dependsOn:
      - install-dependencies
    command: composer test

services:
  laravel:
    name: Laravel application
    description: Laravel development server
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 8000 --admission creator_only --name "Laravel application"
        until test -f vendor/autoload.php && test -f .env; do sleep 1; done
        php artisan serve --host=0.0.0.0 --port=8000
      ready: curl -fsS http://localhost:8000

  vite:
    name: Vite development server
    description: Vite frontend development server with hot reload
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 5173 --admission creator_only --name "Vite development server"
        export ONA_EXPOSED_HOST="$(ona environment port get 5173 -f URL | cut -c 9-)"
        until test -d node_modules; do sleep 1; done
        __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS="$ONA_EXPOSED_HOST" npm run dev -- --host 0.0.0.0 --port 5173
      ready: curl -fsS http://localhost:5173/@vite/client

tasks:
  install-dependencies:
    name: Install dependencies
    command: |
      composer install
      npm install --ignore-scripts
      test -f .env || cp .env.example .env
      php artisan key:generate --force
      mkdir -p database
      touch database/database.sqlite
      php artisan migrate --force
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build-assets:
    name: Build assets
    command: npm run build
    dependsOn:
      - install-dependencies
    triggeredBy:
      - manual

  test:
    name: Run tests
    command: composer test
    dependsOn:
      - install-dependencies
    triggeredBy:
      - manual

services:
  laravel:
    name: Laravel application
    description: Laravel development server
    commands:
      start: |
        ona environment port open 8000 --admission creator_only --name "Laravel application"
        php artisan serve --host=0.0.0.0 --port=8000
      ready: curl -fsS http://localhost:8000 >/dev/null
    triggeredBy:
      - manual
      - postEnvironmentStart

  vite:
    name: Vite dev server
    description: Vite asset development server
    commands:
      start: |
        ona environment port open 5173 --admission creator_only --name "Vite dev server"
        npm run dev -- --host 0.0.0.0
      ready: curl -fsS http://localhost:5173/@vite/client >/dev/null
    triggeredBy:
      - manual
      - postEnvironmentStart

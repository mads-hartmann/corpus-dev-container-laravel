tasks:
  installDeps:
    name: Install dependencies
    description: Install PHP and Node dependencies, set up the environment file, application key, and SQLite database.
    command: |
      composer install
      [ -f .env ] || cp .env.example .env
      php artisan key:generate
      [ -f database/database.sqlite ] || touch database/database.sqlite
      php artisan migrate --force
      npm install
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build assets
    description: Compile front-end assets with Vite.
    command: |
      npm run build
    triggeredBy:
      - manual
    dependsOn:
      - installDeps

  test:
    name: Test
    description: Run the application test suite.
    command: |
      php artisan config:clear --ansi
      php artisan test
    triggeredBy:
      - manual
    dependsOn:
      - installDeps

services:
  laravel:
    name: Laravel server
    description: Run the Laravel development server.
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 8000 --dont-wait --admission creator_only --name laravel
        php artisan serve --host=0.0.0.0 --port=8000
      ready: |
        curl -sf http://localhost:8000 > /dev/null

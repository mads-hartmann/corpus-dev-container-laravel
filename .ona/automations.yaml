tasks:
  installDeps:
    name: Install dependencies
    description: Install PHP and Node dependencies, prepare the environment, and run database migrations.
    command: |
      composer install
      [ -f .env ] || cp .env.example .env
      php artisan key:generate
      [ -f database/database.sqlite ] || touch database/database.sqlite
      php artisan migrate --force
      npm install
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build assets
    description: Build the frontend assets with Vite.
    command: |
      npm run build
    triggeredBy:
      - manual
    dependsOn:
      - installDeps

  test:
    name: Run tests
    description: Run the PHPUnit test suite.
    command: |
      php artisan config:clear --ansi
      php artisan test
    triggeredBy:
      - manual
    dependsOn:
      - installDeps

services:
  laravel:
    name: Laravel server
    description: Serve the Laravel application.
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 8000 --dont-wait --admission creator_only --name "laravel"
        php artisan serve --host=0.0.0.0 --port=8000
      ready: |
        curl -sf http://localhost:8000

  vite:
    name: Vite dev server
    description: Run the Vite dev server for frontend hot module replacement.
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 5173 --dont-wait --admission creator_only --name "vite"
        npm run dev -- --host 0.0.0.0
      ready: |
        curl -sf http://localhost:5173/@vite/client
